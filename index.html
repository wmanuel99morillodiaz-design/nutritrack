<!DOCTYPE html>
<html lang="es">
<head> <link rel="stylesheet" href="style.css">

  <meta charset="UTF-8">
  <title>NutriTrack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 20px;
    }
    h1 { color: #22c55e; }
    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 16px;
    }
    button {
      background: #22c55e;
      border: none;
      border-radius: 6px;
      color: black;
    }
  </style>
</head>
<body>

<h1>NutriTrack</h1>
<p>Control nutricional para ganar masa</p>

<div class="card">
  <h2>Añadir comida</h2>
  <input id="protein" type="number" placeholder="Proteína (g)">
  <input id="carbs" type="number" placeholder="Carbohidratos (g)">
  <input id="fat" type="number" placeholder="Grasas (g)">
  <button onclick="addMeal()">Añadir</button>
</div>

<div class="card">
  <h2>Totales del día</h2>
  <p id="totals">Aún no hay datos</p>
</div>

<script>
let p = 0, c = 0, f = 0;

function addMeal() {
  p += Number(protein.value) || 0;
  c += Number(carbs.value) || 0;
  f += Number(fat.value) || 0;

  totals.innerText =
    `Proteína: ${p} / 165 g
Carbohidratos: ${c} / 390 g
Grasas: ${f} / 70 g`;
}
</script>

</body>
</html>
